<section id="bl-work-section">
    <!-- Portfolio Title Starts -->
    <div class="bl-box valign-wrapper">
        <div class="page-title center-align">
            <h2 class="center-align">
                <span data-hover="my">my </span>
                <span data-hover="projects">projects</span>
            </h2>
        </div>
    </div>
    <!-- Portfolio Title Ends -->
    <!-- Portfolio Expanded Starts -->
    <div class="bl-content">
        <!-- Main Heading Starts -->
        <div class="container page-title center-align">
            <h2 class="center-align">
                <span data-hover="my">my </span>
                <span data-hover="projects">projects</span>
            </h2>
        </div>
        <!-- Main Heading Ends -->
        <div class="container">
            <!-- Divider Starts -->
            <div class="divider center-align">
                <span class="outer-line"></span>
                <span class="fa fa-suitcase" aria-hidden="true"></span>
                <span class="outer-line"></span>
            </div>
            <!-- Divider Ends -->


            <div class="row s12 m12 l12 xl12 center-align p-none">
                <p class="second-font">{{ site.portfolio.description }}</p>
            </div>

            <div class="row center-align da-thumbs" id="bl-work-items">
                {%- for portfolio in site.portfolios -%}
                <!-- Project Starts -->
                <div class="col s12 m6 l6 xl4" data-panel="panel-{{ forloop.index }}">
                    <a href="#">
                        <img class="responsive-img" src="{{portfolio.preview-image | relative_url }}" alt="{{portfolio.title }}" />
                        <div class="valign-wrapper"><span class="font-weight-700">{{ portfolio.mini-description }}</span></div>
                    </a>

                    <span clas="second-font">{{ portfolio.title }}</span>
                </div>
                <!-- Project Ends -->
                {%- endfor -%}
            </div>
        </div>
    </div>
    <!-- Portfolio Expanded Ends -->
    <img alt="close" src="{{'/resources/images/close-button.webp' | relative_url }}" class="bl-icon-close" />

</section>
